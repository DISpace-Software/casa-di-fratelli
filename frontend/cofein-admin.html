<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Cofein Admin</title>
  </head>
  <body>
    <p><a href="https://seatmap-admin-eight.vercel.app/r/cofein/admin">Администрация на Cofein</a></p>
    <script>
      const target = new URL("https://seatmap-admin-eight.vercel.app/r/cofein/admin");
      // Retain valid reset-link parameters, never transfer stored credentials.
      const current = new URL(window.location.href);
      for (const key of ["email", "resetToken"]) {
        if (current.searchParams.has(key)) target.searchParams.set(key, current.searchParams.get(key));
      }
      window.location.replace(target.href);
    </script>
  </body>
</html>
