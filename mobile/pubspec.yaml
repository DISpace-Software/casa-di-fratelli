name: seatmap_mobile
description: SeatMap restaurant discovery and seat-map booking MVP for iOS and Android.
publish_to: none
version: 1.0.1+2

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  timezone: ^0.11.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
